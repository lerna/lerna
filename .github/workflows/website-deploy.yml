name: Deploy Lerna website to lerna/website

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Minimal permissions by default
permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: website

jobs:
  test-deploy:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 26

      - name: Install dependencies
        # The website is an npm workspace, so the lockfile lives at the repo root
        working-directory: .
        run: npm ci --omit=optional --workspace website --include-workspace-root=false

      - name: Test build website
        run: npm run build

  deploy:
    if: github.repository == 'lerna/lerna' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.GH_PAGES_DEPLOY }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 26

      - name: Install dependencies
        # The website is an npm workspace, so the lockfile lives at the repo root
        working-directory: .
        run: npm ci --omit=optional --workspace website --include-workspace-root=false

      - name: Deploy to lerna/website
        env:
          USE_SSH: true
        run: |
          git config --global user.email "3447705+bcabanes@users.noreply.github.com"
          git config --global user.name "bcabanes"
          npm run deploy
