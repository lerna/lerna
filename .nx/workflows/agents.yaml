# Nx Agent launch templates for Linux CI.
# Replaces the GitHub Actions agent matrix in ci.yml and other-node-versions.yml.
# Keep the toolchain aligned with .github/actions/install-node-and-dependencies.
#
# CI and a UTF-8 locale are set here (not forwarded from GitHub Actions) so task
# output matches the previous runners without GitHub log grouping.

install-primary-package-managers: &install-primary-package-managers
  name: Install Package Managers
  script: |
    set -euo pipefail
    # Primary Node matches the composite action: pinned corepack, then the packageManager npm.
    npm install --global corepack@0.35.0 --min-release-age=0 --ignore-scripts --force
    corepack enable
    npm install --global "$(node -p "require('./package.json').packageManager")" --min-release-age=0 --ignore-scripts
    corepack install -g pnpm@8
    corepack install -g yarn@1.22.22
    bun_version="$(npm view bun@1 version --json | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{const v=JSON.parse(s);const arr=[].concat(v);arr.sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));process.stdout.write(arr.at(-1));})')"
    curl -fsSL https://bun.sh/install | bash -s "bun-v${bun_version}"
    cp "${BUN_INSTALL:-$HOME/.bun}/bin/bun" "$(dirname "$(command -v node)")/bun"
  env:
    COREPACK_ENABLE_AUTO_PIN: "0"
    COREPACK_ENABLE_STRICT: "0"

install-additional-package-managers: &install-additional-package-managers
  name: Install Package Managers
  script: |
    set -euo pipefail
    # Alternate Node versions do not install the repo's pinned npm; they use the npm that ships with that Node.
    corepack enable
    corepack install -g pnpm@8
    corepack install -g yarn@1.22.22
    bun_version="$(npm view bun@1 version --json | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{const v=JSON.parse(s);const arr=[].concat(v);arr.sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));process.stdout.write(arr.at(-1));})')"
    curl -fsSL https://bun.sh/install | bash -s "bun-v${bun_version}"
    cp "${BUN_INSTALL:-$HOME/.bun}/bin/bun" "$(dirname "$(command -v node)")/bun"
  env:
    COREPACK_ENABLE_AUTO_PIN: "0"
    COREPACK_ENABLE_STRICT: "0"

print-tool-versions: &print-tool-versions
  name: Print Tool Versions
  script: |
    node --version
    npm --version
    yarn --version
    pnpm --version
    bun --version

configure-git-metadata: &configure-git-metadata
  name: Configure Git Metadata
  script: |
    git config --global user.email test@example.com
    git config --global user.name "Tester McPerson"

remove-volta-pin: &remove-volta-pin
  name: Remove Volta Pin
  script: |
    node -e 'const fs=require("fs"); const pkg=JSON.parse(fs.readFileSync("package.json","utf8")); delete pkg.volta; fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");'

launch-templates:
  linux-lerna:
    resource-class: "docker_linux_amd64/medium"
    image: "ubuntu22.04-node24.14-v1"
    env:
      CI: "true"
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      COREPACK_ENABLE_AUTO_PIN: "0"
      COREPACK_ENABLE_STRICT: "0"
    init-steps:
      - name: Checkout
        uses: "nrwl/nx-cloud-workflows/v6/workflow-steps/checkout/main.yaml"

      - name: Install Node From Volta
        uses: "nrwl/nx-cloud-workflows/v6/workflow-steps/install-node/main.yaml"

      - *install-primary-package-managers

      - *print-tool-versions

      - name: Install Node Modules
        uses: "nrwl/nx-cloud-workflows/v6/workflow-steps/install-node-modules/main.yaml"
        inputs:
          npm_legacy_install: "false"

      - *configure-git-metadata

  linux-node22-lerna:
    resource-class: "docker_linux_amd64/medium"
    image: "ubuntu22.04-node24.14-v1"
    env:
      CI: "true"
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      COREPACK_ENABLE_AUTO_PIN: "0"
      COREPACK_ENABLE_STRICT: "0"
      # Type stripping is still experimental and off by default on 22.13.0.
      NODE_OPTIONS: "--experimental-strip-types"
    init-steps:
      - name: Checkout
        uses: "nrwl/nx-cloud-workflows/v6/workflow-steps/checkout/main.yaml"

      - name: Install Node 22.13.0
        uses: "nrwl/nx-cloud-workflows/v6/workflow-steps/install-node/main.yaml"
        inputs:
          node_version: "22.13.0"

      - *install-additional-package-managers

      - *print-tool-versions

      - name: Install Node Modules
        uses: "nrwl/nx-cloud-workflows/v6/workflow-steps/install-node-modules/main.yaml"
        inputs:
          npm_legacy_install: "false"

      - *remove-volta-pin

      - *configure-git-metadata

  linux-node24-lerna:
    resource-class: "docker_linux_amd64/medium"
    image: "ubuntu22.04-node24.14-v1"
    env:
      CI: "true"
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      COREPACK_ENABLE_AUTO_PIN: "0"
      COREPACK_ENABLE_STRICT: "0"
    init-steps:
      - name: Checkout
        uses: "nrwl/nx-cloud-workflows/v6/workflow-steps/checkout/main.yaml"

      - name: Install Node 24
        uses: "nrwl/nx-cloud-workflows/v6/workflow-steps/install-node/main.yaml"
        inputs:
          node_version: "24"

      - *install-additional-package-managers

      - *print-tool-versions

      - name: Install Node Modules
        uses: "nrwl/nx-cloud-workflows/v6/workflow-steps/install-node-modules/main.yaml"
        inputs:
          npm_legacy_install: "false"

      - *remove-volta-pin

      - *configure-git-metadata
